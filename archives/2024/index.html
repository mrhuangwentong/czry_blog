<script>
document.addEventListener('DOMContentLoaded', function() {
  // 检查是否是首页
  const path = window.location.pathname;
  const isHome = path === '/' || path === '/index.html';
  
  // 如果是首页，隐藏文章内容
  if (isHome) {
    document.querySelectorAll('.post-body, .post-eof').forEach(function(el) {
      el.style.display = 'none';
    });
  }
  
  // 在每篇文章的元信息后面添加作者、阅读量、转发量
  const posts = document.querySelectorAll('.post-block');
  
  posts.forEach(function(post) {
    const metaContainer = post.querySelector('.post-meta-container');
    if (!metaContainer) return;
    
    // 检查是否已经添加了自定义元信息，避免重复
    const existingCustomMeta = metaContainer.querySelector('.custom-meta-added');
    if (existingCustomMeta) return;
    
    const titleText = post.querySelector('.post-title').textContent;
    
    const author = '潮州若榆环保科技有限公司';
    let reading_info = '';
    let repost_info = '';
    
    if (titleText.includes('驾乘险') || titleText.includes('驾乘无忧')) {
      reading_info = '21440';
      repost_info = '13617';
    } else if (titleText.includes('疲劳驾驶')) {
      reading_info = '30812';
      repost_info = '8193';
    } else if (titleText.includes('防台') || titleText.includes('台风来临')) {
      reading_info = '54744';
      repost_info = '13686';
    } else if (titleText.includes('申能保险')) {
      reading_info = '5628';
      repost_info = '1245';
    } else if (titleText.includes('假期期间') || titleText.includes('五一')) {
      reading_info = '30812';
      repost_info = '8193';
    }
    
    // 创建作者信息
    const authorMeta = document.createElement('span');
    authorMeta.className = 'post-meta-item custom-meta-added';
    authorMeta.innerHTML = `
      <span class="post-meta-item-icon">
        <i class="far fa-user"></i>
      </span>
      <span class="post-meta-item-text">作者：</span>
      <span>${author}</span>
    `;
    metaContainer.querySelector('.post-meta').appendChild(authorMeta);
    
    // 创建阅读量信息
    if (reading_info) {
      const readingMeta = document.createElement('span');
      readingMeta.className = 'post-meta-item custom-meta-added';
      readingMeta.innerHTML = `
        <span class="post-meta-item-icon">
          <i class="far fa-eye"></i>
        </span>
        <span class="post-meta-item-text">阅读量：</span>
        <span>${reading_info}</span>
      `;
      metaContainer.querySelector('.post-meta').appendChild(readingMeta);
    }
    
    // 创建转发量信息
    if (repost_info) {
      const repostMeta = document.createElement('span');
      repostMeta.className = 'post-meta-item custom-meta-added';
      repostMeta.innerHTML = `
        <span class="post-meta-item-icon">
          <i class="far fa-share-square"></i>
        </span>
        <span class="post-meta-item-text">转发量：</span>
        <span>${repost_info}</span>
      `;
      metaContainer.querySelector('.post-meta').appendChild(repostMeta);
    }
  });
});
</script>
